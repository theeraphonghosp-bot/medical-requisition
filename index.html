<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>เบิกวัสดุการแพทย์ออนไลน์ - รพ.ชานุมาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #0f9d76;
    --primary-hover: #0b7a5c;
    --primary-active: #085e46;
    --primary-light: #e8f5f1;
    --primary-border: #a3e0ce;
    --bg: #f6f8fa;
    --card-bg: #ffffff;
    --text-main: #1f2937;
    --text-muted: #6b7280;
    --border: #d1d5db;
    --border-light: #e5e7eb;
    --danger: #dc2626;
    --danger-bg: #fee2e2;
    --danger-text: #b91c1c;
    --warning: #d97706;
    --warning-bg: #fef3c7;
    --warning-text: #92400e;
    --info: #2563eb;
    --info-bg: #dbeafe;
    --info-text: #1e40af;
    --success: #059669;
    --success-bg: #d1fae5;
    --success-text: #065f46;
    --radius-lg: 16px;
    --radius-md: 10px;
    --radius-sm: 6px;
    --shadow-card: 0 4px 14px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.03);
    --shadow-btn: 0 4px 12px rgba(15, 157, 118, 0.22);
  }

  * { box-sizing: border-box; }

  body {
    font-family: "Sarabun", "Tahoma", -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text-main);
    -webkit-font-smoothing: antialiased;
    font-size: 15px;
    line-height: 1.5;
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 16px 36px;
  }

  /* Header Banner */
  .header-card {
    background: linear-gradient(135deg, #0f9d76 0%, #0b7a5c 100%);
    color: #ffffff;
    border-radius: var(--radius-lg);
    padding: 22px 24px;
    margin-bottom: 18px;
    box-shadow: 0 6px 18px rgba(15, 157, 118, 0.25);
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .header-icon {
    font-size: 34px;
    background: rgba(255, 255, 255, 0.18);
    width: 58px;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    flex-shrink: 0;
  }

  .header-text h1 {
    font-size: 21px;
    font-weight: 700;
    margin: 0 0 4px;
    line-height: 1.25;
    letter-spacing: -0.2px;
  }

  .header-text .subtitle {
    font-size: 13.5px;
    color: rgba(255, 255, 255, 0.9);
    font-weight: 400;
  }

  /* Card */
  .card {
    background: var(--card-bg);
    border-radius: var(--radius-lg);
    padding: 20px 22px;
    margin-bottom: 18px;
    box-shadow: var(--shadow-card);
    border: 1px solid var(--border-light);
  }

  .card-title {
    font-size: 16px;
    font-weight: 600;
    color: #111827;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid #f1f5f9;
  }

  .card-title .card-icon {
    font-size: 18px;
  }

  /* Forms & Inputs */
  label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    margin: 10px 0 5px;
    color: #374151;
  }

  label .req {
    color: var(--danger);
    font-weight: bold;
    margin-left: 2px;
  }

  input, select {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 14px;
    font-size: 15px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    font-family: inherit;
    background: #ffffff;
    color: var(--text-main);
    transition: all 0.15s ease-in-out;
  }

  input:focus, select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3.5px rgba(15, 157, 118, 0.18);
  }

  input::placeholder {
    color: #9ca3af;
    font-size: 14px;
  }

  .row {
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }

  .row > * { flex: 1; min-width: 0; }
  .row > .narrow { flex: 0 0 110px; }

  /* Stock Info Bar */
  .stockinfo-bar {
    background: var(--primary-light);
    color: var(--primary-hover);
    border: 1px solid var(--primary-border);
    padding: 9px 14px;
    border-radius: var(--radius-md);
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Buttons */
  button {
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    border: 0;
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .primary {
    background: var(--primary);
    color: #ffffff;
    width: 100%;
    padding: 13px 18px;
    font-size: 16px;
    box-shadow: var(--shadow-btn);
  }

  .primary:hover:not(:disabled) {
    background: var(--primary-hover);
    box-shadow: 0 6px 16px rgba(15, 157, 118, 0.3);
    transform: translateY(-1px);
  }

  .primary:active:not(:disabled) {
    background: var(--primary-active);
    transform: translateY(0);
  }

  .primary:disabled {
    background: #9ca3af;
    cursor: not-allowed;
    box-shadow: none;
  }

  .add {
    background: var(--primary);
    color: #ffffff;
    padding: 10px 16px;
    height: 44px;
  }

  .add:hover {
    background: var(--primary-hover);
  }

  .ghost {
    background: #ffffff;
    color: var(--text-main);
    border: 1.5px solid var(--border);
    width: 100%;
    padding: 11px 16px;
    font-size: 14.5px;
  }

  .ghost:hover {
    background: #f9fafb;
    border-color: var(--primary);
    color: var(--primary);
  }

  /* Item List Display with Inline Add Button */
  .item-list-container {
    margin-top: 12px;
    max-height: 400px;
    overflow-y: auto;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    background: #ffffff;
  }

  .item-list-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 14px;
    border-bottom: 1px solid #f1f5f9;
    gap: 12px;
    transition: background 0.12s ease;
  }

  .item-list-row:last-child {
    border-bottom: none;
  }

  .item-list-row:hover {
    background: #f8fafc;
  }

  .item-list-row.out-of-stock {
    opacity: 0.65;
    background: #fafafa;
  }

  .item-main-info {
    flex: 1;
    min-width: 0;
  }

  .item-title {
    font-size: 15px;
    font-weight: 600;
    color: #111827;
    margin-bottom: 3px;
    line-height: 1.35;
    word-break: break-word;
  }

  .item-sub {
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .item-stock-tag {
    display: inline-flex;
    align-items: center;
    font-size: 12px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    background: #dcfce7;
    color: #166534;
  }

  .item-stock-tag.zero {
    background: #fee2e2;
    color: #991b1b;
  }

  .item-cat-tag {
    display: inline-flex;
    align-items: center;
    font-size: 11.5px;
    font-weight: 500;
    padding: 1px 7px;
    border-radius: 4px;
    background: #f1f5f9;
    color: #475569;
    border: 1px solid #e2e8f0;
    white-space: nowrap;
  }

  .item-search-box {
    margin-top: 10px;
    position: relative;
    width: 100%;
  }

  .item-search-box input {
    width: 100%;
    padding-right: 36px;
    font-size: 14.5px;
  }

  .item-search-clear {
    display: none;
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    border-radius: 50%;
    width: 24px;
    height: 24px;
    padding: 0;
    font-size: 13px;
    color: #64748b;
    cursor: pointer;
    line-height: 22px;
    text-align: center;
    transition: all 0.15s ease;
  }

  .item-search-clear:hover {
    background: #e2e8f0;
    color: #1e293b;
    border-color: #94a3b8;
  }

  .item-action-side {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .item-qty-input {
    width: 62px !important;
    padding: 7px 4px !important;
    text-align: center;
    font-size: 14.5px;
    font-weight: 600;
    border-radius: 8px !important;
    margin: 0 !important;
    box-sizing: border-box;
  }

  .btn-add-inline {
    background: var(--primary);
    color: #ffffff;
    border: none;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .btn-add-inline:hover {
    background: var(--primary-hover);
    box-shadow: 0 2px 6px rgba(15, 157, 118, 0.3);
  }

  .btn-add-inline:disabled {
    background: #e2e8f0;
    color: #94a3b8;
    cursor: not-allowed;
    box-shadow: none;
  }

  /* Cart Table */
  .cart-container {
    margin-top: 14px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-light);
    overflow: hidden;
    background: #ffffff;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  th {
    background: #f8fafc;
    color: #475569;
    font-weight: 600;
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1.5px solid var(--border-light);
    font-size: 13px;
  }

  td {
    border-bottom: 1px solid #f1f5f9;
    padding: 10px 12px;
    vertical-align: middle;
  }

  tr:last-child td {
    border-bottom: 0;
  }

  td.num {
    width: 110px;
    text-align: center;
  }

  td.num input {
    padding: 6px 8px;
    text-align: center;
    font-weight: 600;
    font-size: 15px;
    border-radius: var(--radius-sm);
    max-width: 80px;
  }

  td.del-col {
    width: 60px;
    text-align: right;
  }

  .del {
    background: var(--danger-bg);
    color: var(--danger-text);
    padding: 5px 10px;
    font-size: 13px;
    font-weight: 500;
    border-radius: var(--radius-sm);
    border: 1px solid rgba(220, 38, 38, 0.15);
  }

  .del:hover {
    background: #fecaca;
  }

  .cart-item-name {
    font-weight: 600;
    color: #111827;
    margin-bottom: 2px;
  }

  .cart-item-badge {
    display: inline-block;
    font-size: 12px;
    background: #f3f4f6;
    color: #4b5563;
    padding: 2px 7px;
    border-radius: 4px;
    margin-top: 2px;
  }

  .cart-stock-rem {
    color: var(--primary-hover);
    font-weight: 500;
  }

  .empty-state {
    text-align: center;
    padding: 24px 16px;
    color: var(--text-muted);
    font-size: 14px;
  }

  .empty-state .empty-icon {
    font-size: 30px;
    margin-bottom: 6px;
    opacity: 0.6;
  }

  .cart-summary-bar {
    background: #f8fafc;
    border-top: 1px solid var(--border-light);
    padding: 9px 14px;
    font-size: 13.5px;
    font-weight: 600;
    color: #334155;
    text-align: right;
  }

  /* Status Badges */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 9px;
    border-radius: 12px;
    font-size: 12.5px;
    font-weight: 600;
    white-space: nowrap;
    border: 1px solid transparent;
  }

  .badge-wait {
    background: var(--warning-bg);
    color: var(--warning-text);
    border-color: #fde68a;
  }

  .badge-ack {
    background: var(--info-bg);
    color: var(--info-text);
    border-color: #bfdbfe;
  }

  .badge-done {
    background: var(--success-bg);
    color: var(--success-text);
    border-color: #a7f3d0;
  }

  .badge-cancel {
    background: var(--danger-bg);
    color: var(--danger-text);
    border-color: #fca5a5;
  }

  .badge-gray {
    background: #f3f4f6;
    color: #4b5563;
    border-color: #e5e7eb;
  }

  /* Alert / Message */
  .msg {
    padding: 12px 16px;
    border-radius: var(--radius-md);
    margin: 12px 0;
    display: none;
    font-weight: 500;
    font-size: 14.5px;
  }

  .ok {
    background: var(--success-bg);
    color: var(--success-text);
    border: 1px solid #a7f3d0;
  }

  .err {
    background: var(--danger-bg);
    color: var(--danger-text);
    border: 1px solid #fca5a5;
  }

  /* History Section */
  .history-box {
    margin-top: 12px;
  }

  .hist-row {
    padding: 12px 14px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-light);
    margin-bottom: 8px;
    background: #ffffff;
    display: flex;
    gap: 10px;
    justify-content: space-between;
    align-items: center;
    transition: all 0.1s ease;
  }

  .hist-row:hover {
    background: #f9fafb;
    border-color: #cbd5e1;
  }

  .hist-info {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .hist-title {
    font-weight: 600;
    font-size: 14px;
    color: #111827;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .hist-meta {
    font-size: 13px;
    color: var(--text-muted);
  }

  .hist-row button {
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 500;
    border-radius: var(--radius-sm);
    white-space: nowrap;
    border: 1px solid var(--border);
    background: #ffffff;
    color: var(--text-main);
  }

  .hist-row button:hover {
    background: var(--primary-light);
    border-color: var(--primary);
    color: var(--primary);
  }

  /* Print Slip Actions */
  .slip-actions {
    max-width: 760px;
    margin: 16px auto;
    padding: 0 16px;
    display: none;
    gap: 12px;
  }

  .slip-actions button {
    flex: 1;
    padding: 12px 18px;
    font-size: 15px;
  }

  .slip-print-btn {
    background: var(--primary);
    color: #ffffff;
    box-shadow: var(--shadow-btn);
  }

  .slip-back-btn {
    background: #ffffff;
    border: 1.5px solid var(--border);
    color: var(--text-main);
  }

  /* Printable Slip (On-screen preview styling) */
  #slip {
    display: none;
    background: #ffffff;
    padding: 32px 36px;
    max-width: 760px;
    margin: 0 auto 24px;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    border: 1px solid var(--border-light);
  }

  #slip h2 {
    text-align: center;
    font-size: 19px;
    margin: 0 0 12px;
    font-weight: 700;
    color: #000000;
  }

  #slip .head {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
    font-size: 14.5px;
    color: #111;
  }

  #slip table {
    width: 100%;
    border-collapse: collapse;
    border: 1px solid #000;
    font-size: 13.5px;
    margin-top: 8px;
  }

  #slip th, #slip td {
    border: 1px solid #000;
    padding: 6px 8px;
    color: #000;
  }

  #slip th {
    background: #f5f5f5;
    text-align: center;
    font-weight: 600;
  }

  #slip td.c {
    text-align: center;
  }

  #slip .sig {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px 40px;
    margin-top: 36px;
    font-size: 14px;
    color: #000;
  }

  #slip .sig div {
    text-align: center;
    line-height: 1.8;
  }

  /* Mobile Responsive (<= 540px) */
  @media (max-width: 540px) {
    .wrap {
      padding: 12px 10px 28px;
    }

    .header-card {
      padding: 16px 16px;
      gap: 12px;
      margin-bottom: 14px;
      border-radius: 14px;
    }

    .header-icon {
      font-size: 28px;
      width: 48px;
      height: 48px;
      border-radius: 10px;
    }

    .header-text h1 {
      font-size: 18px;
    }

    .header-text .subtitle {
      font-size: 12.5px;
    }

    .card {
      padding: 16px 14px;
      margin-bottom: 14px;
      border-radius: 14px;
    }

    .row {
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
    }

    .row > * {
      width: 100%;
      flex: 1 1 100%;
    }

    .row > .narrow {
      width: 100%;
      flex: 1 1 100%;
    }

    .add {
      width: 100%;
      margin-top: 6px;
    }

    td.num {
      width: 80px;
      padding: 8px 4px;
    }

    td.num input {
      max-width: 65px;
      font-size: 14px;
      padding: 6px 2px;
    }

    td.del-col {
      width: 48px;
      padding: 8px 4px;
    }

    .del {
      padding: 5px 8px;
      font-size: 12px;
    }

    #slip {
      padding: 16px 12px;
    }

    #slip .sig {
      grid-template-columns: 1fr;
      gap: 20px;
      margin-top: 24px;
    }
  }

  /* Exact A4 Print Output (Maintained unmodified for printing) */
  @media print {
    @page {
      size: A4 portrait;
      margin: 12mm 14mm;
    }
    body {
      background: #ffffff !important;
      color: #000000 !important;
      font-family: "Sarabun", "Tahoma", sans-serif !important;
    }
    .wrap, .slip-actions {
      display: none !important;
    }
    #slip {
      display: block !important;
      padding: 0 !important;
      max-width: none !important;
      background: transparent !important;
      border: 0 !important;
      box-shadow: none !important;
      border-radius: 0 !important;
    }
    #slip h2 {
      text-align: center;
      font-size: 18pt;
      margin: 0 0 10pt;
      font-weight: bold;
    }
    #slip .head {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4pt;
      margin-bottom: 8pt;
      font-size: 12pt;
    }
    #slip table {
      width: 100%;
      border-collapse: collapse;
      border: 1.5px solid #000;
      font-size: 11pt;
      margin-top: 6pt;
    }
    #slip th, #slip td {
      border: 1px solid #000;
      padding: 5pt 6pt;
      color: #000;
    }
    #slip th {
      background: #f0f0f0 !important;
      -webkit-print-color-adjust: exact;
      text-align: center;
      font-weight: bold;
    }
    #slip td.c {
      text-align: center;
    }
    #slip .sig {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24pt 36pt;
      margin-top: 32pt;
      font-size: 11pt;
    }
    #slip .sig div {
      text-align: center;
      line-height: 1.8;
    }
  }
</style>
</head>
<body>

<div class="wrap" id="main">
  <!-- Header -->
  <div class="header-card">
    <div class="header-icon">🏥</div>
    <div class="header-text">
      <h1>เบิกวัสดุการแพทย์ออนไลน์</h1>
      <div class="subtitle">กลุ่มงานการพยาบาล โรงพยาบาลชานุมาน</div>
    </div>
  </div>

  <!-- Card 1: ข้อมูลผู้เบิก -->
  <div class="card">
    <div class="card-title">
      <span class="card-icon">🏢</span> ข้อมูลหน่วยงานผู้เบิก
    </div>
    
    <div class="row">
      <div>
        <label for="dept">หน่วยงานที่เบิก <span class="req">*</span></label>
        <select id="dept"><option value="">กำลังโหลด...</option></select>
      </div>
      <div>
        <label for="requester">ชื่อผู้เบิก <span class="req">*</span></label>
        <input id="requester" autocomplete="name" placeholder="ชื่อ-นามสกุล ผู้ขอเบิก">
      </div>
    </div>
  </div>

  <!-- Card 2: เลือกรายการพัสดุ -->
  <div class="card">
    <div class="card-title">
      <span class="card-icon">📦</span> เลือกพัสดุที่ต้องการเบิก
    </div>

    <div class="stockinfo-bar" id="stockinfo">
      <span>ℹ️</span> กำลังโหลดข้อมูล...
    </div>

    <label for="cat">หมวดพัสดุ</label>
    <select id="cat"></select>

    <!-- ช่องค้นหารายการพัสดุ -->
    <div class="item-search-box">
      <input type="text" id="item-search" placeholder="🔍 พิมพ์ค้นหาชื่อหรือรหัสพัสดุ (ไม่ต้องเลือกหมวดก็ได้)" autocomplete="off">
      <button type="button" id="btn-clear-search" class="item-search-clear" title="ล้างการค้นหา">✕</button>
    </div>

    <!-- รายการพัสดุในหมวด -->
    <div style="margin-top: 14px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 6px; flex-wrap:wrap; gap:4px;">
        <span style="font-size: 13.5px; font-weight: 600; color: #374151;">รายการพัสดุ</span>
        <span id="item-count-badge" style="font-size: 12.5px; color: #6b7280;"></span>
      </div>
      <div class="item-list-container" id="item-list-box">
        <div id="item-list"></div>
      </div>
    </div>

    <!-- Cart Table -->
    <div class="cart-container">
      <table id="cart">
        <thead>
          <tr>
            <th>รายการพัสดุ</th>
            <th style="width: 110px; text-align: center;">จำนวน</th>
            <th style="width: 60px; text-align: right;">จัดการ</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="empty-state" id="empty">
        <div class="empty-icon">🛒</div>
        <div>ยังไม่มีรายการในใบเบิก — กรุณาเลือกหมวดพัสดุแล้วกดปุ่ม "➕ เพิ่ม" ข้างรายการ</div>
      </div>
      <div id="cart-summary" class="cart-summary-bar" style="display:none;"></div>
    </div>
  </div>

  <!-- Status / Alert message -->
  <div id="msg" class="msg"></div>

  <!-- Submit button -->
  <button class="primary" id="send">📨 ส่งใบเบิก</button>

  <!-- Card 3: ประวัติใบเบิก -->
  <div class="card" style="margin-top: 18px;">
    <button class="ghost" id="hist">📋 ดูใบเบิกของหน่วยงาน / พิมพ์ซ้ำ</button>
    <div id="history" class="history-box"></div>
  </div>
</div>

<!-- Print Slip Actions -->
<div class="slip-actions" id="slipActions">
  <button class="slip-print-btn" onclick="window.print()">🖨️ พิมพ์ใบเบิก (A4)</button>
  <button class="slip-back-btn" onclick="closeSlip()">⬅️ กลับไปหน้าเบิก</button>
</div>

<!-- Printable Slip -->
<div id="slip"></div>

<script>
var ITEMS = [], DEPTS = [], CART = [];
var TH_MONTH = ['', 'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function show(text, ok) {
  var m = $('msg');
  m.textContent = text;
  m.className = 'msg ' + (ok ? 'ok' : 'err');
  m.style.display = 'block';
  m.scrollIntoView({behavior: 'smooth', block: 'nearest'});
}
function fmt(n) { return Number(n).toLocaleString('th-TH', {maximumFractionDigits: 2}); }
function itemByCode(c) { return ITEMS.filter(function (i) { return i.code === c; })[0]; }

// Status badge helper function
function statusBadge(status) {
  var s = String(status || '').trim();
  if (s === 'รอคลังรับเรื่อง') {
    return '<span class="badge badge-wait">⏳ ' + esc(s) + '</span>';
  } else if (s === 'คลังรับเรื่องแล้ว') {
    return '<span class="badge badge-ack">📋 ' + esc(s) + '</span>';
  } else if (s === 'จ่ายแล้ว') {
    return '<span class="badge badge-done">✅ ' + esc(s) + '</span>';
  } else if (s === 'ยกเลิก') {
    return '<span class="badge badge-cancel">❌ ' + esc(s) + '</span>';
  }
  return '<span class="badge badge-gray">' + esc(s) + '</span>';
}

// Support local browser mockup if outside Google Apps Script environment
if (typeof google === 'undefined' || !google.script) {
  window.google = {
    script: {
      run: {
        withSuccessHandler: function (cb) {
          return {
            withFailureHandler: function () { return this; },
            getInit: function () {
              setTimeout(function () {
                cb({
                  depts: [
                    {code: 'ARI', name: 'คลินิกโรคทางเดินหายใจ (ARI)'},
                    {code: 'OPD', name: 'ผู้ป่วยนอก (OPD)'},
                    {code: 'IPD', name: 'ผู้ป่วยใน (IPD)'},
                    {code: 'ER', name: 'อุบัติเหตุและฉุกเฉิน (ER)'}
                  ],
                  items: [
                    {code: '1000001', name: 'SYRINGE 5 ML N/N', unit: 'กล่อง (100 ชิ้น)', category: 'อุปกรณ์ฉีดยา', stock: 120},
                    {code: '1000002', name: 'SURGICAL GLOVES NO. 7', unit: 'กล่อง (50 คู่)', category: 'ถุงมือตรวจโรค', stock: 45},
                    {code: '1000003', name: 'ALCOHOL 70% 450 ML', unit: 'ขวด', category: 'น้ำยาฆ่าเชื้อ', stock: 18},
                    {code: '1000004', name: 'NEEDLE NO. 21G X 1.5"', unit: 'กล่อง (100 ชิ้น)', category: 'เข็มฉีดยา', stock: 0}
                  ],
                  updated_at: '15/10/2569 19:07'
                });
              }, 50);
            },
            submitRequest: function (req) {
              setTimeout(function () {
                cb({req_id: 'W691015200000-' + req.dept_code, count: req.lines.length, at: new Date().toISOString()});
              }, 100);
            },
            getMyRequests: function () {
              setTimeout(function () {
                cb([
                  {req_id: 'W691015183000-ARI', at: '15/10/2569 18:30', status: 'รอคลังรับเรื่อง', doc_no: '', n: 2},
                  {req_id: 'W691015142000-ARI', at: '15/10/2569 14:20', status: 'คลังรับเรื่องแล้ว', doc_no: 'IS70-0002', n: 4},
                  {req_id: 'W691014091500-ARI', at: '14/10/2569 09:15', status: 'จ่ายแล้ว', doc_no: 'IS70-0001', n: 3}
                ]);
              }, 50);
            },
            getRequestDetail: function (dept, pin, id) {
              setTimeout(function () {
                cb({
                  req_id: id,
                  at: new Date().toISOString(),
                  dept_code: dept,
                  dept_name: 'คลินิกโรคทางเดินหายใจ (ARI)',
                  requester: 'พยาบาลเวร',
                  note: 'ด่วน',
                  status: 'รอคลังรับเรื่อง',
                  doc_no: '',
                  lines: [
                    {item_code: '1000001', item_name: 'SYRINGE 5 ML N/N', unit: 'กล่อง (100 ชิ้น)', qty: 2},
                    {item_code: '1000002', item_name: 'SURGICAL GLOVES NO. 7', unit: 'กล่อง (50 คู่)', qty: 1}
                  ]
                });
              }, 50);
            }
          };
        }
      }
    }
  };
}

google.script.run.withSuccessHandler(function (d) {
  DEPTS = d.depts; ITEMS = d.items;
  $('dept').innerHTML = '<option value="">-- เลือกหน่วยงาน --</option>' +
    DEPTS.map(function (x) { return '<option value="' + esc(x.code) + '">' + esc(x.name) + ' (' + esc(x.code) + ')</option>'; }).join('');
  var cats = {}; ITEMS.forEach(function (i) { if (i.category) cats[i.category] = 1; });
  $('cat').innerHTML = '<option value="">-- เลือกหมวดพัสดุ --</option><option value="__ALL__">📦 แสดงทุกหมวด</option>' +
    Object.keys(cats).sort().map(function (c) {
      return '<option value="' + esc(c) + '">' + esc(c) + '</option>';
    }).join('');
  $('stockinfo').innerHTML = '<span>ℹ️</span> ข้อมูล ณ ' + (d.updated_at || '-') + ' — รายการที่ขึ้นว่า ❌ หมด จะเบิกไม่ได้';
  fillItems();
  try {
    var last = localStorage.getItem('dept'); if (last) $('dept').value = last;
    var who = localStorage.getItem('requester'); if (who) $('requester').value = who;
  } catch (e) {}
}).withFailureHandler(function (e) { show('โหลดข้อมูลไม่ได้: ' + e.message, false); }).getInit();

function fillItems() {
  var cat = $('cat') ? $('cat').value : '';
  var searchInput = $('item-search');
  var rawQ = searchInput ? searchInput.value : '';
  var q = rawQ.trim().toLowerCase();
  var isSearching = q.length > 0;

  var clearBtn = $('btn-clear-search');
  if (clearBtn) {
    clearBtn.style.display = isSearching ? 'inline-flex' : 'none';
  }

  // If no category selected AND not searching: show prompt
  if (!cat && !isSearching) {
    $('item-list').innerHTML = '<div style="padding: 24px 16px; text-align: center; color: #6b7280; font-size: 14px;">👉 กรุณาเลือก <b>หมวดพัสดุ</b> ด้านบน หรือพิมพ์ค้นหาชื่อ/รหัสพัสดุด้านบน</div>';
    var badge = $('item-count-badge'); if (badge) badge.textContent = '';
    return;
  }

  var isCrossCategory = !cat || cat === '__ALL__';
  var words = isSearching ? q.split(/\s+/).filter(Boolean) : [];

  var list = ITEMS.filter(function (i) {
    if (cat && cat !== '__ALL__' && i.category !== cat) return false;
    if (isSearching) {
      var name = String(i.name || '').toLowerCase();
      var code = String(i.code || '').toLowerCase();
      var matchAll = words.every(function (w) {
        return name.indexOf(w) !== -1 || code.indexOf(w) !== -1;
      });
      if (!matchAll) return false;
    }
    return true;
  }).sort(function (a, b) {
    return (b.stock > 0) - (a.stock > 0) || String(a.name).localeCompare(String(b.name), 'th');
  });

  var badge = $('item-count-badge');
  var totalFound = list.length;

  if (totalFound === 0) {
    if (badge) badge.textContent = 'พบ 0 รายการ';
    if (isSearching) {
      $('item-list').innerHTML = '<div style="padding: 24px 16px; text-align: center; color: #9ca3af; font-size: 14px;">ไม่พบรายการที่ค้นหา</div>';
    } else {
      $('item-list').innerHTML = '<div style="padding: 24px 16px; text-align: center; color: #9ca3af; font-size: 14px;">ไม่พบรายการพัสดุในหมวดนี้</div>';
    }
    return;
  }

  var MAX_ITEMS = 50;
  var isOverLimit = totalFound > MAX_ITEMS;
  var displayList = isOverLimit ? list.slice(0, MAX_ITEMS) : list;

  if (badge) {
    if (isOverLimit) {
      badge.innerHTML = '<span style="color:#d97706; font-weight:600;">พบ ' + totalFound + ' รายการ (แสดง ' + MAX_ITEMS + ' รายการแรก พิมพ์เพิ่มเพื่อกรองให้แคบลง)</span>';
    } else {
      badge.textContent = 'พบ ' + totalFound + ' รายการ';
    }
  }

  var html = displayList.map(function (it) {
    var outOfStock = it.stock <= 0;
    var stockBadge = outOfStock
      ? '<span class="item-stock-tag zero">❌ หมด</span>'
      : '<span class="item-stock-tag">หน่วย: ' + esc(it.unit) + '</span>';

    var catTag = (isCrossCategory && it.category)
      ? '<span class="item-cat-tag">📂 ' + esc(it.category) + '</span>'
      : '';

    var actionHtml = outOfStock
      ? '<button type="button" class="btn-add-inline" disabled style="background:#f1f5f9;color:#94a3b8;cursor:not-allowed;">ของหมด</button>'
      : '<input type="number" class="item-qty-input" id="qty-' + esc(it.code) + '" min="1" max="' + it.stock + '" value="1">' +
        '<button type="button" class="btn-add-inline" id="btn-' + esc(it.code) + '" onclick="addFromList(\'' + esc(it.code) + '\', this)">➕ เพิ่ม</button>';

    return '<div class="item-list-row' + (outOfStock ? ' out-of-stock' : '') + '">' +
      '<div class="item-main-info">' +
        '<div class="item-title">' + esc(it.name) + '</div>' +
        '<div class="item-sub">' +
          '<span style="font-family: monospace; background: #f3f4f6; padding: 1px 6px; border-radius: 4px; font-size: 12px; color: #4b5563;">[' + esc(it.code) + ']</span>' +
          stockBadge +
          catTag +
        '</div>' +
      '</div>' +
      '<div class="item-action-side">' +
        actionHtml +
      '</div>' +
    '</div>';
  }).join('');

  if (isOverLimit) {
    html += '<div style="padding: 12px 16px; text-align: center; color: #d97706; background: #fffbeb; font-size: 13px; border-top: 1px dashed #fde68a;">⚠️ พบ ' + totalFound + ' รายการ แสดง ' + MAX_ITEMS + ' รายการแรก พิมพ์เพิ่มเพื่อกรองให้แคบลง</div>';
  }

  $('item-list').innerHTML = html;
}
$('cat').addEventListener('change', fillItems);

var itemSearchEl = $('item-search');
if (itemSearchEl) {
  itemSearchEl.addEventListener('input', fillItems);
  itemSearchEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') e.preventDefault();
  });
}

var clearSearchBtn = $('btn-clear-search');
if (clearSearchBtn) {
  clearSearchBtn.addEventListener('click', function () {
    if (itemSearchEl) {
      itemSearchEl.value = '';
      itemSearchEl.focus();
    }
    fillItems();
  });
}

function addFromList(code, btn) {
  var it = itemByCode(code);
  if (!it) return;
  var qtyInput = $('qty-' + code);
  var q = qtyInput ? Number(qtyInput.value) : 1;
  if (!(q > 0)) {
    show('กรุณาระบุจำนวนที่ถูกต้องสำหรับ ' + it.name, false);
    return;
  }
  if (it.stock <= 0) {
    show(it.name + ' ของหมด เบิกไม่ได้', false);
    return;
  }
  var ex = CART.filter(function (c) { return c.item_code === it.code; })[0];
  var total = (ex ? ex.qty : 0) + q;
  if (total > it.stock) {
    show(it.name + ' — จำนวนที่ขอเกินกว่าที่คลังมีอยู่ กรุณาลดจำนวน หรือติดต่องานคลัง', false);
    return;
  }
  if (ex) {
    ex.qty = total;
  } else {
    CART.push({item_code: it.code, item_name: it.name, unit: it.unit, qty: q});
  }
  $('msg').style.display = 'none';
  if (qtyInput) qtyInput.value = 1;
  draw();

  if (btn) {
    var origText = btn.innerHTML;
    btn.innerHTML = '✓ เพิ่มแล้ว';
    btn.style.background = '#059669';
    btn.disabled = true;
    setTimeout(function () {
      btn.innerHTML = origText;
      btn.style.background = '';
      btn.disabled = false;
    }, 700);
  }
}

function draw() {
  $('empty').style.display = CART.length ? 'none' : 'block';
  $('cart').querySelector('tbody').innerHTML = CART.map(function (c, i) {
    var it = itemByCode(c.item_code) || {stock: 0};
    return '<tr>' +
      '<td><div class="cart-item-name">' + esc(c.item_name) + '</div>' +
      '<div class="cart-item-badge">' + esc(c.item_code) + ' · หน่วย: ' + esc(c.unit) + '</div></td>' +
      '<td class="num"><input type="number" min="1" max="' + it.stock + '" value="' + c.qty + '" data-i="' + i + '"></td>' +
      '<td class="del-col"><button class="del" data-del="' + i + '" title="ลบรายการนี้">ลบ</button></td></tr>';
  }).join('');

  var summary = $('cart-summary');
  var countBadge = $('cart-item-count');
  if (CART.length > 0) {
    var totalQty = CART.reduce(function (sum, x) { return sum + Number(x.qty || 0); }, 0);
    summary.innerHTML = 'รวม ' + CART.length + ' รายการ · จำนวนรวม <b>' + fmt(totalQty) + '</b> ชิ้น';
    summary.style.display = 'block';
    if (countBadge) countBadge.textContent = '(' + CART.length + ' รายการ)';
  } else {
    summary.style.display = 'none';
    if (countBadge) countBadge.textContent = '';
  }
}

$('cart').addEventListener('change', function (ev) {
  var i = ev.target.getAttribute('data-i'); if (i === null) return;
  var it = itemByCode(CART[i].item_code), v = Number(ev.target.value);
  if (it && v > it.stock) { v = it.stock; show(it.name + ' — จำนวนที่ขอเกินกว่าที่คลังมีอยู่ ระบบปรับเป็นจำนวนสูงสุดที่เบิกได้ให้แล้ว', false); }
  CART[i].qty = v > 0 ? v : 1; draw();
});

$('cart').addEventListener('click', function (ev) {
  var target = ev.target;
  if (!target.hasAttribute('data-del')) target = target.closest('[data-del]');
  if (target) {
    var i = target.getAttribute('data-del');
    if (i !== null) { CART.splice(Number(i), 1); draw(); }
  }
});

$('send').addEventListener('click', function () {
  var code = $('dept').value;
  if (!code) { show('กรุณาเลือกหน่วยงานที่เบิก', false); return; }
  var requester = $('requester').value.trim();
  if (!requester) { show('กรุณาระบุชื่อผู้เบิก', false); return; }
  if (!CART.length) { show('กรุณาเลือกพัสดุอย่างน้อย 1 รายการ โดยกดปุ่ม "➕ เพิ่ม" ข้างรายการ', false); return; }

  var d = DEPTS.filter(function (x) { return x.code === code; })[0];
  var payload = {
    dept_code: code,
    dept_name: d ? d.name : '',
    pin: '',
    requester: requester,
    note: '',
    lines: CART
  };
  var btn = this; btn.disabled = true; btn.textContent = '⏳ กำลังส่งใบเบิก...';
  google.script.run.withSuccessHandler(function (r) {
    show('ส่งใบเบิกแล้ว เลขที่ ' + r.req_id + ' (' + r.count + ' รายการ) — รอคลังรับเรื่อง', true);
    try { localStorage.setItem('dept', code); localStorage.setItem('requester', payload.requester); } catch (e) {}
    openSlip({req_id: r.req_id, at: r.at, dept_code: code, dept_name: payload.dept_name, requester: payload.requester,
              note: '', status: 'รอคลังรับเรื่อง', doc_no: '', lines: CART.slice()});
    CART = []; draw();
    btn.disabled = false; btn.textContent = '📨 ส่งใบเบิก';
  }).withFailureHandler(function (e) {
    show(e.message, false); btn.disabled = false; btn.textContent = '📨 ส่งใบเบิก';
  }).submitRequest(payload);
});

$('hist').addEventListener('click', function () {
  var code = $('dept').value;
  if (!code) { show('กรุณาเลือกหน่วยงานที่เบิกก่อนดูประวัติ', false); return; }
  $('history').innerHTML = '<div style="padding:12px;text-align:center;color:#6b7280;">⏳ กำลังโหลดประวัติ...</div>';
  google.script.run.withSuccessHandler(function (rows) {
    if (!rows || !rows.length) {
      $('history').innerHTML = '<div class="empty-state">ยังไม่มีใบเบิกของหน่วยงานนี้</div>';
      return;
    }
    $('history').innerHTML = rows.map(function (r) {
      return '<div class="hist-row">' +
        '<div class="hist-info">' +
          '<div class="hist-title">' +
            '<span>📄 ' + esc(r.req_id) + '</span>' +
            statusBadge(r.status) +
          '</div>' +
          '<div class="hist-meta">' +
            '<span>🕒 ' + esc(r.at) + '</span> · ' +
            '<span>📦 ' + r.n + ' รายการ</span>' +
            (r.doc_no ? ' · <span style="color:#0f9d76;font-weight:600;">(เลขจ่าย ' + esc(r.doc_no) + ')</span>' : '') +
          '</div>' +
        '</div>' +
        '<button data-print="' + esc(r.req_id) + '">🖨️ พิมพ์</button>' +
      '</div>';
    }).join('');
  }).withFailureHandler(function (e) {
    $('history').innerHTML = '<div class="err" style="display:block;">' + esc(e.message) + '</div>';
  }).getMyRequests(code, '');
});

$('history').addEventListener('click', function (ev) {
  var target = ev.target;
  if (!target.hasAttribute('data-print')) target = target.closest('[data-print]');
  if (!target) return;
  var id = target.getAttribute('data-print');
  if (!id) return;
  google.script.run.withSuccessHandler(openSlip).withFailureHandler(function (e) { show(e.message, false); })
    .getRequestDetail($('dept').value, '', id);
});

function thDate(iso) {
  var d = iso ? new Date(iso) : new Date();
  return d.getDate() + ' ' + TH_MONTH[d.getMonth() + 1] + ' ' + (d.getFullYear() + 543);
}

function openSlip(r) {
  var rows = r.lines.map(function (l, i) {
    return '<tr><td class="c">' + (i + 1) + '</td><td>' + esc(l.item_name) + ' <span style="color:#555">(' + esc(l.item_code) + ')</span></td>' +
      '<td class="c">' + esc(l.unit) + '</td><td class="c">' + fmt(l.qty) + '</td><td></td><td></td></tr>';
  });
  for (var k = r.lines.length; k < 12; k++) rows.push('<tr><td class="c">&nbsp;</td><td></td><td></td><td></td><td></td><td></td></tr>');
  $('slip').innerHTML =
    '<h2>ใบเบิกวัสดุการแพทย์ กลุ่มงานการพยาบาล</h2>' +
    '<div class="head"><span>เลขที่เบิก (ออนไลน์): <b>' + esc(r.req_id) + '</b>' + (r.doc_no ? ' / ' + esc(r.doc_no) : '') + '</span>' +
    '<span>วันที่ ' + thDate(r.at) + '</span></div>' +
    '<div class="head"><span>หน่วยงานที่เบิก: <b>' + esc(r.dept_name || r.dept_code) + '</b></span><span>สถานะ: ' + esc(r.status || '') + '</span></div>' +
    (r.note ? '<div class="head"><span>หมายเหตุ: ' + esc(r.note) + '</span></div>' : '') +
    '<table><thead><tr><th style="width:44px">ลำดับ</th><th>รายการ</th><th style="width:70px">หน่วย</th><th style="width:80px">จำนวนขอเบิก</th>' +
    '<th style="width:80px">จำนวนจ่าย</th><th style="width:90px">หมายเหตุ</th></tr></thead><tbody>' + rows.join('') + '</tbody></table>' +
    '<div class="sig">' +
    '<div>ลงชื่อ.......................................ผู้เบิก<br>(' + esc(r.requester || '.......................................') + ')<br>ตำแหน่ง.......................................</div>' +
    '<div>ลงชื่อ.......................................ผู้จ่าย<br>(.......................................)<br>ตำแหน่ง.......................................</div>' +
    '<div>ลงชื่อ.......................................ผู้อนุมัติ<br>(.......................................)<br>ตำแหน่ง.......................................</div>' +
    '<div>ลงชื่อ.......................................ผู้รับ<br>(.......................................)<br>ตำแหน่ง.......................................</div>' +
    '</div>';
  $('main').style.display = 'none'; $('slip').style.display = 'block'; $('slipActions').style.display = 'flex';
  window.scrollTo(0, 0);
}

function closeSlip() {
  $('main').style.display = 'block'; $('slip').style.display = 'none'; $('slipActions').style.display = 'none';
}

draw();
</script>
</body>
</html>
